<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // The app owns the scroll position (see src/components/Layout.tsx).
      // Without this the browser restores the previous offset on reload, and a
      // visitor who refreshes mid-page lands past the hero — which also means
      // the hero entrance animation plays off-screen, unseen.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>

    <title>Nina — Productos de software | ninabuild</title>
    <meta
      name="description"
      content="Nina construye productos de software. Conocé Yottu, el marketplace que conecta centros de belleza de todo tipo con sus clientes: reservas, mapa, calificaciones y pago por tokens."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#07070b" />
    <meta
      name="google-site-verification"
      content="Xwqx91scppJt1hZUhiFqITJMZagojuv7zfpwDj1FrCA"
    />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph (WhatsApp, LinkedIn, Facebook, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nina" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Nina — Productos de software | ninabuild" />
    <meta
      property="og:description"
      content="Construimos productos de software. Conocé Yottu, el marketplace de centros de belleza."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nina" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nina — Productos de software | ninabuild" />
    <meta
      name="twitter:description"
      content="Construimos productos de software. Conocé Yottu, el marketplace de centros de belleza."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nina",
        "alternateName": "ninabuild",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/og-image.jpg",
        "description": "Nina construye productos de software."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Fallback for crawlers and users without JavaScript. Everything here is
      replaced by the app once it boots; it exists so a bot that does not run
      JS still finds real content instead of an empty page.
    -->
    <noscript>
      <div
        style="
          max-width: 42rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font-family: system-ui, sans-serif;
          color: #f4f4f7;
          background: #07070b;
        "
      >
        <h1 style="font-size: 2rem">Nina</h1>
        <p style="color: #9a99a8">
          Nina construye productos de software. Nuestro producto <strong>Yottu</strong> es el
          marketplace que conecta centros de belleza de todo tipo con sus clientes: reservas,
          búsqueda en mapa, calificaciones y pago por tokens (Yottus). Disponible en web y Android.
        </p>
        <p style="color: #9a99a8">
          Activa JavaScript para ver el sitio completo, o escribinos a
          <a href="mailto:hola@nina.dev" style="color: #ff4d8d">hola@nina.dev</a>.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
